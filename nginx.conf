server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind Kong — use client Host, not container hostname (avoids redirect to saffron-frontend)
    absolute_redirect off;
    port_in_redirect off;

    client_max_body_size 6m;

    # Static assets (hashed filenames) — cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached so browsers always get the
    # latest chunk hashes after a deployment. Without this, a stale
    # index.html causes "Failed to fetch dynamically imported module".
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
